[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge-lab"
version = "0.0.0"
description = "Deliberately imperfect teaching system for Software Engineering for Agentic Development"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
