name: Content model

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test content validator
        run: python tools/test_content_model.py
      - name: Validate canonical Markdown content
        run: python tools/content_model.py validate
      - name: Smoke derived manifests
        run: |
          python tools/content_model.py manifest --visibility student >/dev/null
          python tools/content_model.py manifest --visibility instructor >/dev/null
          python tools/content_model.py manifest --visibility all >/dev/null
