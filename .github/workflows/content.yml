name: Content model

on:
  pull_request:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test content validator
        run: python tools/test_content_model.py
      - name: Validate canonical Markdown content
        run: python tools/content_model.py validate
      - name: Smoke derived manifests
        run: |
          python tools/content_model.py manifest --visibility student >/dev/null
          python tools/content_model.py manifest --visibility instructor >/dev/null
          python tools/content_model.py manifest --visibility all >/dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build and verify student site
        run: npm --prefix site run build:student
      - uses: actions/upload-artifact@v7
        with:
          name: student-course-site
          path: site/.vitepress/dist
